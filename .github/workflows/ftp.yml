name: Validate and deploy website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Unit tests
        run: yarn test
      - name: Build static website
        run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: build/client/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.repository == 'forpublicai/publicai.ch' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: build/client/
      # Full upload is required because hashed assets are generated, not tracked.
      # First-deploy removal of obsolete remote files is an admin task; see docs.
      - name: Upload built website
        uses: milanmk/actions-file-deployer@b204fec5b826c391b116c40b789df470a4fb6870
        with:
          local-path: build/client
          sync: full
          remote-protocol: ftp
          remote-host: ${{ secrets.DEPLOY_REMOTE_HOST }}
          remote-user: ${{ secrets.DEPLOY_REMOTE_USER }}
          remote-password: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          remote-port: 21
          remote-path: /
